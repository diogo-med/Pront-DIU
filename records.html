<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="description" content="PWA para preenchimento da ficha clínica de consulta de enfermagem para inserção do DIU." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>ProntDIU — Prontuários</title>
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div class="page-header-top">
        <div class="page-header-brand">
          <img src="icons/LOGO.png" alt="Logo ProntDIU" />
          <p class="eyebrow">ProntDIU</p>
        </div>
        <div class="hero-actions">
          <a href="index.html?new=true" class="primary">Nova Triagem</a>
          <a href="insercao.html?new=true" class="secondary">Nova Inserção</a>
        </div>
      </div>

      <h1 class="page-header-title">Prontuários salvos</h1>
    </header>

    <main class="content">
      <section class="records-header card">
        <div>
          <h2 class="section-kicker">Lista de prontuários</h2>
          <p class="lead records-lead">Prontuários salvos neste dispositivo, do mais recente para o mais antigo. Abra para editar, exporte ou exclua.</p>
        </div>
        <div class="records-summary">
          <strong id="recordsCount">0</strong>
          <span>itens salvos</span>
        </div>
      </section>

      <section class="records-toolbar card">
        <label class="records-search">
          <strong>Buscar</strong>
          <input type="search" id="recordsSearch" placeholder="Nome ou n° do prontuário" autocomplete="off" />
        </label>
        <div class="records-toolbar-actions">
          <button type="button" class="secondary" id="exportAllCsvBtn">Exportar todos (CSV)</button>
          <button type="button" class="secondary" id="backupBtn">Fazer backup (JSON)</button>
          <button type="button" class="secondary" id="restoreBtn">Restaurar backup</button>
          <input type="file" id="restoreFile" accept=".json,application/json" hidden />
        </div>
      </section>

      <div id="recordsEmpty" class="notice records-empty" hidden>
        <strong></strong>
        <span></span>
      </div>

      <div id="recordsList" class="records-list"></div>
    </main>
  </div>

  <template id="toastTemplate">
    <div class="toast" role="status" aria-live="polite"></div>
  </template>

  <script src="records.js" type="module"></script>
</body>
</html>
